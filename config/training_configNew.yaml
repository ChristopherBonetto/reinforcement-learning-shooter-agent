behaviors:
    Hummingbird:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            learning_rate: 3.0e-4
            learning_rate_schedule: linear
            beta: 5.0e-3
            epsilon: 0.2
            lambd: 0.95
            num_epoch: 3
            
        network_settings:
            normalize: false
            hidden_units: 256
            num_layers: 2
            vis_encode_type: simple
            memory:
                sequence_length: 64
                memory_size: 128

        summary_freq: 10000

        reward_signals:
            extrinsic:
                strength: 1.0
                gamma: 0.99

        time_horizon: 128

        max_steps: 5.0e6
        
    ShooterAgent:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            
            beta: 0.1
        network_settings:
            hidden_units: 512
            num_layers: 3
            summary_freq: 5000
                        
        reward_signals:
            extrinsic:
                strength: 1.0
                gamma: 0.99
            curiosity:
                strength: 0.01
                gamma: 0.99
                encoding_size: 128
                
        time_horizon: 128
        
        max_steps: 5.0e5
        
         
# Add this section
environment_parameters:
  ShooterAgent:
    curriculum:
      - name: FirstStep # The '-' is important as this is a list
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          parameters:
            amountEnemies: [2, 3, 4, 5, 6, 6]
            enemySpeed: [1.2, 1.3, 1.4, 1.5, 1, 1.5]
            shootingFrequenzy: [25, 25, 25, 25, 25, 25]
        value: 0.0
    