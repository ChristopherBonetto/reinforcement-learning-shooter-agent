behaviors:
  ShooterAgent:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            
            beta: 0.1
        network_settings:
            hidden_units: 512
            num_layers: 3
            summary_freq: 5000
                        
        reward_signals:
            extrinsic:
                strength: 1.0
                gamma: 0.99
            curiosity:
                strength: 0.01
                gamma: 0.99
                encoding_size: 128
                
        time_horizon: 128
        
        max_steps: 5.0e5
  
environment_parameters:
  arenaParam_amountEnemies:
    curriculum:
      - name: Lesson0 # The '-' is important as this is a list
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          require_reset: true
        value: 2
      - name: Lesson1 # This is the start of the second lesson
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          require_reset: true
        value: 3
      - name: Lesson2
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          require_reset: true
        value: 4
      - name: Lesson3
        value: 5
        
        
        
  arenaParam_enemiesSpeed:
    curriculum:
      - name: Lesson0 # The '-' is important as this is a list
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          require_reset: true
        value: 1.2
      - name: Lesson1 # This is the start of the second lesson
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          require_reset: true
        value: 1.4
      - name: Lesson2
        completion_criteria:
          measure: reward
          behavior: ShooterAgent
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.5
          require_reset: true
        value: 1.6
      - name: Lesson3
        value: 1.8