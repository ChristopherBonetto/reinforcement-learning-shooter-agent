behaviors:
    ShooterAgent:
        trainer_type: ppo
        hyperparameters:
            batch_size: 2048
            buffer_size: 20480
            
            beta: 0.1
        network_settings:
            hidden_units: 512
            num_layers: 3
            summary_freq: 5000
                        
        reward_signals:
            extrinsic:
                strength: 1.0
                gamma: 0.99
            curiosity:
                strength: 0.01
                gamma: 0.99
                encoding_size: 128
                
        time_horizon: 128
        
        max_steps: 5.0e5
        
curriculum:
    ShooterAgent:

        measure: reward
        behavior: ShooterAgent
        signal_smoothing: true
        min_lesson_length: 1000
        threshold: 0.5
        parameters:
            amountEnemies: [2, 3, 4, 5, 6, 6]
            enemySpeed: [1.2, 1.3, 1.4, 1.5, 1, 1.5]
            shootingFrequenzy: [25, 25, 25, 25, 25, 25]